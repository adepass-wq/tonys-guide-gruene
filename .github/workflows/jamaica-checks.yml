name: Jamaica source and behavior checks
on:
  pull_request:
    paths: ['jamaica/**', 'package.json', 'package-lock.json', '.github/workflows/jamaica-checks.yml']
  push:
    branches: [main, 'workflow/**']
    paths: ['jamaica/**', 'package.json', 'package-lock.json', '.github/workflows/jamaica-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
